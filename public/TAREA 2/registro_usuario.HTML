<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Invocamos hoja de estilo css con link -->
    <link rel="stylesheet" href="STYLES.CSS">
    <title>TAREA 2</title>
</head>
<body>

<!-- div principal que encierra todo el form y su contenido -->
<div>
    <form>
    <h1>Actividad 2: Formulario de registro de usuario </h1>
    
    <h2>Registrarse en la Pagina Web</h2>
    
    <p>Por favor complete sus datos</p>

    <!-- input con placeholder para guiar al usuario -->
    <!-- <label for="Nombre">Nombre</label><br> -->
    <input type="text" name="Nombre" class="Nombre" placeholder="Nombre" required>
    <br><br>
    
    <!-- input con placeholder para guiar al usuario -->
    <!-- <label for="Correo">Correo Electronico</label><br> -->
    <input type="email" name="Correo" class="Correo" placeholder="Correo Electronico" required>
    <br><br>

    <!-- input con placeholder para guiar al usuario -->
    <!-- <label for="Usuario">Nombre de Usuario</label><br> -->
    <input type="text" name="Usuario" class="Usuario" placeholder="Nombre de Usuario" required>
    <br><br>

    <!-- input con placeholder para guiar al usuario -->
    <!-- <label for="Contraseña">Contraseña</label><br> -->
    <input type="password" name="Contraseña" class="Contraseña" placeholder="Contraseña" required>
    <br><br>

    <!-- input con placeholder para guiar al usuario -->
    <!-- <label for="Confirmar">Confirmar Contraseña</label><br> -->
    <input type="password" name="Confirmar" class="Confirmar" placeholder="Confirmar Contraseña" required>
    <br><br>

    <!-- input con placeholder para guiar al usuario -->
    <!-- <label for="Nacimiento">Fecha de Nacimiento</label><br> -->
    <input type="date" name="Nacimiento" class="Nacimiento" placeholder="Fecha de Nacimiento" required>
    
    <br><br>
    <!-- input con registrar con id para su unica modificacion -->
    <input type="submit" value="Registrarse" id="registrar">
    </form>
</div>
    
</body>
</html>
